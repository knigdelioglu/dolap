name: Apply final safety audit

on:
  push:
    branches:
      - fix/final-safety-audit

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Run final safety audit patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/final-safety-audit
      - name: Apply audited fixes
        run: python3 scripts/apply_final_audit.py
      - name: Run regression tests
        run: node tests/geometry-regression.test.js
      - name: Commit final app changes
        run: |
          rm -f scripts/apply_final_audit.py scripts/run-final-audit.txt .github/workflows/apply-final-audit.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete final calculator safety audit"
          git push origin HEAD:fix/final-safety-audit
