name: Apply geometry safety patch

on:
  push:
    branches:
      - fix/geometry-invariants

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Run one-shot geometry safety patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/geometry-invariants

      - name: Apply audited geometry fixes
        run: python3 scripts/apply_geometry_fixes.py

      - name: Run regression tests
        run: node tests/geometry-regression.test.js

      - name: Commit patched calculator and remove one-shot helpers
        run: |
          rm -f scripts/apply_geometry_fixes.py .github/workflows/apply-geometry-fixes.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix cabinet geometry invariants"
          git push origin HEAD:fix/geometry-invariants
